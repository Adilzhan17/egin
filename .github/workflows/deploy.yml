name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='dist' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/agriplan/repo/

      - name: Build & Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR=~/agriplan

            # 1. Записываем .env (убираем DATABASE_URL из PROD_ENV_FILE чтобы явный секрет выиграл)
            echo '${{ secrets.PROD_ENV_FILE }}' | grep -v '^DATABASE_URL=' | grep -v '^DB_SSL=' | grep -v '^DB_MIGRATIONS_RUN=' | sed 's/^[[:space:]]*//' > $APP_DIR/.env
            cat >> $APP_DIR/.env << 'ENVEOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=redis://agriplan-redis:6379
            DB_SSL=false
            DB_MIGRATIONS_RUN=true
            ENVEOF
            sed -i 's/^[[:space:]]*//' $APP_DIR/.env

            # 2. Socat IPv4->IPv6 прокси для Supabase (прямое подключение только IPv6, Docker IPv4-only)
            apt-get install -y socat -qq 2>/dev/null || true
            printf '[Unit]\nDescription=Socat proxy for Supabase\nAfter=network.target\n\n[Service]\nExecStart=/usr/bin/socat TCP4-LISTEN:15432,fork,reuseaddr TCP6:[2406:da14:271:9923:45d5:205b:4ad7:1e61]:5432\nRestart=always\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/socat-supabase.service
            systemctl daemon-reload
            systemctl enable socat-supabase
            systemctl restart socat-supabase

            # 3. Создаём сеть если нет
            docker network create agriplan_default 2>/dev/null || true

            # 4. Собираем оба образа ПАРАЛЛЕЛЬНО
            cd $APP_DIR/repo

            docker build \
              --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
              --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}" \
              -t agriplan-frontend:latest \
              -f frontend/Dockerfile \
              ./frontend &
            PID_FRONT=$!

            docker build \
              -t agriplan-backend:latest \
              -f backend/Dockerfile \
              ./backend &
            PID_BACK=$!

            wait $PID_FRONT
            wait $PID_BACK

            # 5. Копируем docker-compose и запускаем
            cp docker-compose.prod.yml $APP_DIR/docker-compose.yml
            cd $APP_DIR
            # Запускаем обновление контейнеров без полного даунтайма (Rolling Update)
            docker compose up -d --remove-orphans

            # 6. Чистим мусор
            docker image prune -f

            echo "Deploy done!"

name: Trade, billing and video notes
on:
  push:
    paths: ['apps/api/src/platform/**', 'apps/api/src/trade/**', 'apps/api/src/chat/**', 'apps/api/src/server.mjs', 'apps/api/tests/platform*', 'apps/api/tests/trade*', 'apps/api/tests/chat-video*', 'apps/mobile/src/features/business/**', 'apps/mobile/src/features/trade/**', 'apps/mobile/src/features/chat/**', 'apps/mobile/src/features/market/MarketPage.tsx', 'apps/mobile/tests/trade*', 'apps/mobile/tests/business*', 'apps/mobile/tests/chat-video*', 'apps/mobile/tests/chat-trade*', '.github/workflows/business.yml']
  pull_request:
    paths: ['apps/api/src/platform/**', 'apps/api/src/trade/**', 'apps/api/src/chat/**', 'apps/api/src/server.mjs', 'apps/api/tests/platform*', 'apps/api/tests/trade*', 'apps/api/tests/chat-video*', 'apps/mobile/src/features/business/**', 'apps/mobile/src/features/trade/**', 'apps/mobile/src/features/chat/**', 'apps/mobile/src/features/market/MarketPage.tsx', 'apps/mobile/tests/trade*', 'apps/mobile/tests/business*', 'apps/mobile/tests/chat-video*', 'apps/mobile/tests/chat-trade*', '.github/workflows/business.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  business:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: business
          POSTGRES_PASSWORD: business-ci-only
          POSTGRES_DB: business_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U business -d business_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg qpdf
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
      - name: Real database, financial invariants, memberships and private media
        run: node --test apps/api/tests/platform*.test.mjs apps/api/tests/trade.test.mjs apps/api/tests/chat-video-notes.test.mjs
        env:
          MARKET_TEST_DATABASE_URL: postgresql://business:business-ci-only@localhost:5432/business_test
          CHAT_TEST_DATABASE_URL: postgresql://business:business-ci-only@localhost:5432/business_test
          CHAT_MEDIA_TESTS: '1'
      - name: Separate browser store
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U business business_browser
          cd apps/api
          node tests/preview.mjs > /tmp/business-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:4935/api/platform/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/business-preview.log
          exit 1
        env:
          DATA_DIR: /tmp/business-preview-data
          CHAT_DATABASE_URL: postgresql://business:business-ci-only@localhost:5432/business_browser
          MARKET_DATABASE_URL: postgresql://business:business-ci-only@localhost:5432/business_browser
      - run: pnpm --filter @egin/mobile exec playwright install --with-deps chromium webkit
      - name: Real seller and buyer lifecycle
        run: node apps/mobile/tests/trade.cjs
        env:
          EGIN_URL: http://localhost:4935
      - name: Component browser fixtures
        run: |
          pnpm --filter @egin/mobile exec vite --host 127.0.0.1 --port 4947 > /tmp/business-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4947 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/business-vite.log
          exit 1
      - name: Cameras, offline outbox, admin controls and trade cards
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x356748:s=240x240:d=2 -f lavfi -i sine=frequency=440:duration=2 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart -shortest -y /tmp/egin-note-fixture.mp4
          node apps/mobile/tests/chat-video-note.cjs
          node apps/mobile/tests/chat-video-outbox.cjs
          node apps/mobile/tests/business-admin.cjs
          node apps/mobile/tests/business-panel.cjs
          node apps/mobile/tests/business-notifications.cjs
          node apps/mobile/tests/business-deeplinks.cjs
          node apps/mobile/tests/chat-trade-card.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-checks
          path: |
            test-results
            /tmp/business-preview.log
            /tmp/business-vite.log

name: Chat checks
on:
  push:
    paths: ['apps/api/src/chat/**', 'apps/api/src/server.mjs', 'apps/api/src/catalog.json', 'apps/api/tests/chat*', 'apps/mobile/src/features/chat/**', 'apps/mobile/tests/chat*', 'apps/mobile/tests/message-status.test.ts', 'apps/mobile/tests/receipt-state.test.ts', 'apps/mobile/scripts/generate-sw.mjs', 'deploy/Api.Dockerfile', 'deploy/nginx.conf', 'deploy/manage.py', 'docs/CHAT.md', '.github/workflows/chat.yml', 'pnpm-lock.yaml']
  pull_request:
    paths: ['apps/api/src/chat/**', 'apps/api/src/server.mjs', 'apps/api/src/catalog.json', 'apps/api/tests/chat*', 'apps/mobile/src/features/chat/**', 'apps/mobile/tests/chat*', 'apps/mobile/tests/message-status.test.ts', 'apps/mobile/tests/receipt-state.test.ts', 'apps/mobile/scripts/generate-sw.mjs', 'deploy/Api.Dockerfile', 'deploy/nginx.conf', 'deploy/manage.py', 'docs/CHAT.md', '.github/workflows/chat.yml', 'pnpm-lock.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat-ci-only
          POSTGRES_DB: chat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chat -d chat_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install media validators
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg qpdf
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm --filter @egin/mobile test && pnpm build
      - name: Real PostgreSQL, realtime, permissions and media validation
        run: node --test apps/api/tests/chat*.test.mjs
        env:
          CHAT_TEST_DATABASE_URL: postgresql://chat:chat-ci-only@localhost:5432/chat_test
          CHAT_MEDIA_TESTS: '1'
      - name: Isolated browser database and preview
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U chat chat_browser
          cd apps/api
          node tests/preview.mjs > /tmp/chat-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:4935/api/chat/health && curl --fail --silent http://localhost:4935/api/market/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/chat-preview.log
          exit 1
        env:
          DATA_DIR: /tmp/chat-preview-data
          CHAT_DATABASE_URL: postgresql://chat:chat-ci-only@localhost:5432/chat_browser
          MARKET_DATABASE_URL: postgresql://chat:chat-ci-only@localhost:5432/chat_browser
      - run: pnpm --filter @egin/mobile exec playwright install --with-deps chromium webkit
      - name: Generate real video fixture
        run: ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x356748:s=240x240:d=2 -f lavfi -i sine=frequency=440:duration=2 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart -shortest -y /tmp/egin-note-fixture.mp4
      - name: Browser conversation workflows and recovery regressions
        run: node apps/mobile/tests/chat.cjs && node apps/mobile/tests/chat-thread.cjs && node apps/mobile/tests/chat-voice.cjs && node apps/mobile/tests/chat-glass.cjs
        env:
          EGIN_URL: http://localhost:4935
      - name: Allow the shared localhost API rate window to finish
        run: sleep 60
      - name: Receipt, outbox and delayed-media regressions
        run: node apps/mobile/tests/chat-receipts.cjs && node apps/mobile/tests/chat-outbox.cjs && node apps/mobile/tests/chat-media-scroll.cjs
        env:
          EGIN_URL: http://localhost:4935
      - name: Allow the shared API rate window before Chat 2 acceptance
        run: sleep 60
      - name: Chat 2 real two-user acceptance
        run: node apps/mobile/tests/chat2.cjs
        env:
          EGIN_URL: http://localhost:4935
      - name: Allow the shared API rate window before presence acceptance
        run: sleep 60
      - name: Real two-client presence and privacy
        run: node apps/mobile/tests/chat-presence.cjs
        env:
          EGIN_URL: http://localhost:4935
      - name: Start isolated component fixtures
        run: |
          pnpm --filter @egin/mobile exec vite --host 127.0.0.1 --port 4947 > /tmp/chat-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4947 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/chat-vite.log
          exit 1
      - name: Group dialogs, cross-device drafts and materials
        run: node apps/mobile/tests/chat-groups.cjs && node apps/mobile/tests/chat-drafts.cjs && node apps/mobile/tests/chat-materials.cjs && node apps/mobile/tests/chat-wallpaper.cjs && node apps/mobile/tests/chat-extras.cjs
        env:
          EGIN_URL: http://localhost:4947
      - name: Motion lifecycles, stable scroll and media release
        run: node apps/mobile/tests/chat-motion.cjs && node apps/mobile/tests/chat-thread-motion.cjs && node apps/mobile/tests/chat-media-motion.cjs && node apps/mobile/tests/chat-material-motion.cjs && node apps/mobile/tests/chat-reply-motion.cjs
        env:
          EGIN_URL: http://localhost:4947
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-browser-checks
          path: |
            test-results/chat
            test-results/chat-glass-list
            test-results/chat-receipts
            test-results/chat-outbox
            test-results/chat-media-scroll
            test-results/chat2
            test-results/chat-groups
            test-results/chat-materials
            test-results/chat-wallpaper
            test-results/chat-extras
            test-results/chat-presence
            test-results/chat-motion
            test-results/chat-thread-motion
            /tmp/chat-preview.log
            /tmp/chat-vite.log
          if-no-files-found: ignore

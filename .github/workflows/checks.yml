name: Mobile checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_native:
        description: 'Build Android only after an explicit release request'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/browser-dependencies
      - run: pnpm typecheck
      - run: pnpm build
      - name: Branded splash playback, accessibility and offline launch
        run: pnpm --filter @egin/mobile exec node tests/splash.cjs
        env:
          EGIN_SCREENSHOTS: ${{ github.workspace }}/test-results/splash
      - name: Build and test SoilCore native decoder
        run: cmake -S firmware/soilcore -B firmware/soilcore/build && cmake --build firmware/soilcore/build --parallel && ctest --test-dir firmware/soilcore/build --output-on-failure
      - run: pnpm test
      - name: First field, guest draft and return after registration
        run: pnpm --filter @egin/mobile exec node tests/field-onboarding.cjs
      - name: Reproduce restrictive server checkout permissions for public files
        run: chmod -R go-rwx apps/mobile/public apps/developers/public
      - run: docker compose -f deploy/compose.yml up -d --build --wait
        env:
          EGIN_ORIGINS: http://localhost:4934
          EGIN_RP_ID: localhost
          EGIN_PORTAL_ORIGIN: http://localhost:4938
      - name: Solar assembly geometry and multi-view renders
        run: |
          pnpm --filter @egin/mobile exec vite --host 127.0.0.1 --port 4947 > /tmp/soilcore-vite.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4947/ >/dev/null; then break; fi
            sleep 1
          done
          pnpm --filter @egin/mobile exec node tests/soilcore-geometry.cjs
        env:
          EGIN_URL: http://127.0.0.1:4947
          EGIN_SCREENSHOTS: ${{ github.workspace }}/test-results/soilcore-geometry
      - name: Original branding across app, device and API portal
        run: pnpm --filter @egin/mobile exec node tests/brand.cjs
        env:
          EGIN_URL: http://localhost:4934
          EGIN_PORTAL_URL: http://localhost:4938
          EGIN_SCREENSHOTS: ${{ github.workspace }}/test-results/brand
      - name: Staging plant visual and production isolation
        run: pnpm --filter @egin/mobile exec node tests/plant-2d.cjs
        env:
          EGIN_URL: http://localhost:4934
          EGIN_SCREENSHOTS: ${{ github.workspace }}/test-results/plant-2d
      - run: pnpm --filter @egin/mobile exec node tests/browser.cjs
        env:
          EGIN_URL: http://localhost:4934
          EGIN_SCREENSHOTS: ${{ github.workspace }}/test-results/mobile
      - run: pnpm --filter @egin/mobile exec node tests/auth.cjs
        env:
          EGIN_URL: http://localhost:4934
      - run: pnpm --filter @egin/mobile exec node tests/news.cjs
        env:
          EGIN_URL: http://localhost:4934
      - run: pnpm --filter @egin/mobile exec node tests/workspace.cjs
        env:
          EGIN_URL: http://localhost:4934
      - run: pnpm --filter @egin/mobile exec node tests/map-picker.cjs
        env:
          EGIN_URL: http://localhost:4934
      - name: Parcel, events, reports, sync and update regressions
        run: |
          for suite in parcel-passport events reports home-weather sync-ui app-update scene-performance readiness; do
            pnpm --filter @egin/mobile exec node tests/$suite.cjs
          done
        env:
          EGIN_URL: http://localhost:4934
      - run: pnpm --filter @egin/mobile exec node tests/developers.cjs
        env:
          EGIN_URL: http://localhost:4934
          EGIN_PORTAL_URL: http://localhost:4938
      - name: Marketplace seller chat and login return
        run: pnpm --filter @egin/mobile exec node tests/market-contact.cjs
        env:
          EGIN_URL: http://localhost:4934
      - name: QR recognition and login regressions
        run: |
          pnpm --filter @egin/mobile exec node tests/qr-scanner.cjs
          pnpm --filter @egin/mobile exec node tests/qr-recognition.cjs
          pnpm --filter @egin/mobile exec node tests/qr-polling.cjs
        env:
          EGIN_URL: http://localhost:4934
          EGIN_PORTAL_URL: http://localhost:4938
      - run: pnpm --filter @egin/mobile exec node tests/services.cjs
        env:
          EGIN_URL: http://localhost:4934
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-checks
          path: test-results
      - if: always()
        run: docker compose -f deploy/compose.yml down

  android:
    if: github.event_name == 'workflow_dispatch' && inputs.build_native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @egin/mobile native:apk
      - uses: actions/upload-artifact@v4
        with:
          name: EGIN-android-debug
          path: releases/EGIN-android-debug.apk

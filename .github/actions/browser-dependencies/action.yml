name: Install browser test dependencies
description: Bounded package downloads with mirror failover for disposable Ubuntu CI runners
inputs:
  media:
    description: Install ffmpeg and qpdf for API media validation
    default: 'false'
runs:
  using: composite
  steps:
    - name: Verify dependency installer recovery behavior
      shell: bash
      run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
    - name: Install system packages with mirror failover
      shell: bash
      env:
        INSTALL_MEDIA: ${{ inputs.media }}
      run: |
        args=()
        if [[ "$INSTALL_MEDIA" == true ]]; then args+=(--media); fi
        python3 scripts/ci/install_dependencies.py "${args[@]}"
    - name: Install locked Chromium and WebKit browsers
      shell: bash
      env:
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
      run: timeout --kill-after=10s 300s pnpm --filter @egin/mobile exec playwright install chromium webkit

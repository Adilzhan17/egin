name: egin-local-mvp
services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-egin}
      POSTGRES_USER: ${POSTGRES_USER:-egin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-egin-local-development}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - egin_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egin -d egin"]
      interval: 3s
      timeout: 3s
      retries: 25
  core:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        WITH_OLLAMA: ${WITH_OLLAMA:-1}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-egin}:${POSTGRES_PASSWORD:-egin-local-development}@db:5432/${POSTGRES_DB:-egin}
      SESSION_SECRET: ${SESSION_SECRET:-}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      API_ORIGIN: http://localhost:${API_PORT:-8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      PYTHONPATH: /workspace/apps/api
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./packages:/workspace/packages
      - ./scripts:/workspace/scripts
      - ./artifacts:/workspace/artifacts
      - ./data:/workspace/data
      - ./uploads:/workspace/uploads
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "/workspace/scripts/core-entrypoint.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      core:
        condition: service_healthy

volumes:
  egin_data:

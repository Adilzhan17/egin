# Self-hosted stack behind Cloudflare Tunnel (egin.perricheno.com / egin-api.perricheno.com).
# Secrets come from .env next to this file (see .env.selfhost.example); never commit it.
name: egin

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: egin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: egin
      POSTGRES_USER: egin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egin -d egin"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: egin-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    image: egin-backend:latest
    container_name: egin-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3284:3284"
    environment:
      NODE_ENV: production
      PORT: "3284"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: egin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: egin
      DB_SSL: "false"
      DB_MIGRATIONS_RUN: "true"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://egin.perricheno.com}
      APP_ENV: production
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      API_DOCS_ENABLED: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini-2025-08-07}
      GEOCODING_SEARCH_URL: ${GEOCODING_SEARCH_URL:-https://nominatim.openstreetmap.org/search}
      ADMIN_PHONE: ${ADMIN_PHONE:?set ADMIN_PHONE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  gis-service:
    build: ./gis-service
    image: egin-gis-service:latest
    container_name: egin-gis-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:3286:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://egin-api.perricheno.com}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    image: egin-frontend:latest
    container_name: egin-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3285:3285"

volumes:
  postgres_data:

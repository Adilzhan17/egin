map $http_x_forwarded_proto $egin_hsts {
  default "";
  https "max-age=31536000";
}
map $http_x_real_ip $egin_client_ip {
  "" $remote_addr;
  default $http_x_real_ip;
}
server {
  listen 4934;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  include /etc/nginx/security-headers.conf;
  client_max_body_size 9m;
  location /.well-known/ {
    default_type application/json;
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=300";
  }
  location = /api/soilcore/ws {
    proxy_pass http://api:4936;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $egin_client_ip;
    proxy_set_header X-Forwarded-For $egin_client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 130s;
  }
  location /api/ {
    proxy_pass http://api:4936;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $egin_client_ip;
    proxy_set_header X-Forwarded-For $egin_client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 125s;
  }
  location /api/market/ {
    client_max_body_size 11m;
    proxy_pass http://api:4936;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $egin_client_ip;
    proxy_set_header X-Forwarded-For $egin_client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 125s;
  }
  location /api/trade/ {
    client_max_body_size 16m;
    proxy_pass http://api:4936;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $egin_client_ip;
    proxy_set_header X-Forwarded-For $egin_client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 130s;
  }
  location /api/platform/ {
    client_max_body_size 16m;
    proxy_pass http://api:4936;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $egin_client_ip;
    proxy_set_header X-Forwarded-For $egin_client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 130s;
  }
  location /api/chat/ {
    client_max_body_size 16m;
    proxy_pass http://api:4936;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $egin_client_ip;
    proxy_set_header X-Forwarded-For $egin_client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 130s;
  }
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, immutable";
  }
  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    add_header Service-Worker-Allowed "/";
  }
  location = /health { access_log off; default_type text/plain; return 200 'ok'; }
}

server {
  listen 4938;
  server_name _;
  root /usr/share/nginx/portal;
  index index.html;
  server_tokens off;
  client_max_body_size 9m;
  include /etc/nginx/security-headers.conf;
  location ~ ^/(api/developer/|v1/|openapi\.json$) {
    proxy_pass http://api:4936;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $egin_client_ip;
    proxy_set_header X-Forwarded-For $egin_client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 30s;
  }
  location /api/ { return 404; }
  location /developer-assets/ {
    try_files $uri =404;
    expires 1y;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, immutable";
  }
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /health { access_log off; default_type text/plain; return 200 'ok'; }
}

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: egin-postgres
    restart: always
    environment:
      POSTGRES_DB: egin
      POSTGRES_USER: egin
      POSTGRES_PASSWORD: egin_password_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: egin-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    image: egin-backend:latest
    container_name: egin-backend
    restart: always
    ports:
      - "3284:3284"
    environment:
      - NODE_ENV=production
      - PORT=3284
      - DATABASE_URL=postgresql://egin:egin_password_2024@postgres:5432/egin?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=egin_jwt_secret_change_in_production
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

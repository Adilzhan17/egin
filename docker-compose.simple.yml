# Minimal local stack. Secrets come from the environment (see .env.selfhost.example);
# nothing is published beyond localhost.
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: egin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: egin
      POSTGRES_USER: egin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: egin-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    image: egin-backend:latest
    container_name: egin-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3284:3284"
    environment:
      NODE_ENV: production
      PORT: "3284"
      DB_HOST: postgres
      DB_USERNAME: egin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: egin
      DB_SSL: "false"
      DB_MIGRATIONS_RUN: "true"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

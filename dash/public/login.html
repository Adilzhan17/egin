<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGIN DASH — Вход</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #020f07;
    --card: #071510;
    --border: rgba(255,255,255,0.07);
    --green: #4ADE80;
    --green-dim: rgba(74,222,128,0.12);
    --text: rgba(255,255,255,0.88);
    --muted: rgba(255,255,255,0.28);
    --error: #f87171;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
    background: radial-gradient(ellipse 100% 70% at 50% 0%, #0a2a16 0%, #011208 50%, #020f07 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
  }
  .wrap {
    width: 100%;
    max-width: 360px;
    padding: 24px 20px;
  }
  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 56px;
    height: 56px;
    background: rgba(74,222,128,0.08);
    border: 1px solid rgba(74,222,128,0.18);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-title {
    font-size: 1.2rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: #fff;
  }
  .logo-sub {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: -4px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.5);
  }
  .card h2 {
    font-size: 1.1rem;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .card p {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    margin-left: 2px;
  }
  input[type="password"] {
    width: 100%;
    height: 48px;
    background: #0a1f13;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 10px;
    padding: 0 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
    -webkit-box-shadow: 0 0 0 1000px #0a1f13 inset;
    -webkit-text-fill-color: rgba(255,255,255,0.88);
    caret-color: white;
  }
  input[type="password"]:focus {
    border-color: rgba(74,222,128,0.4);
    box-shadow: 0 0 0 3px rgba(74,222,128,0.06);
  }
  .field { margin-bottom: 20px; }
  .btn {
    width: 100%;
    height: 50px;
    background: var(--green);
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 900;
    color: #001710;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(74,222,128,0.2);
    transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: #5ee890; }
  .btn:active { transform: scale(0.97); }
  .error-box {
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.18);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--error);
    margin-bottom: 16px;
    display: none;
  }
  .error-box.show { display: block; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(74,222,128,0.06);
    border: 1px solid rgba(74,222,128,0.12);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(74,222,128,0.6);
    margin-top: 10px;
  }
  .badge-dot {
    width: 5px;
    height: 5px;
    background: var(--green);
    border-radius: 50%;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
        <path d="M16 3C9.5 3 4 8.5 4 16c0 5.2 2.9 9.8 7.2 12.1" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M16 3c4.8 3.2 8 9 8 13 0 4.8-2.8 9-7 11.2" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="16" y1="7" x2="16" y2="27" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="logo-title">E-gin Dash</span>
    <span class="logo-sub">Monitoring · Restricted Access</span>
  </div>

  <div class="card">
    <h2>Авторизация</h2>
    <p>Доступ ограничен. Введите пароль администратора.</p>

    <div id="err" class="error-box">Неверный пароль</div>

    <form method="POST" action="/login">
      <div class="field">
        <label>Пароль</label>
        <input type="password" name="password" autofocus autocomplete="current-password" placeholder="••••••••••••" required>
      </div>
      <button type="submit" class="btn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <rect x="2" y="7" width="12" height="8" rx="1.5"/>
          <path d="M5 7V5a3 3 0 0 1 6 0v2"/>
        </svg>
        Войти
      </button>
    </form>

    <div style="text-align:center">
      <span class="badge"><span class="badge-dot"></span>Cloudflare Zero Trust</span>
    </div>
  </div>
</div>

<script>
  if (location.search.includes("error=1")) {
    document.getElementById("err").classList.add("show");
  }
</script>
</body>
</html>
